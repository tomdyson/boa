<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checklist</title>
<!-- Everything comes from boa itself: fonts, the page's styles (built by `boa push`), the boa library, then Alpine. Keep this order. -->
<link rel="stylesheet" href="/_boa/fonts.css">
<link rel="stylesheet" href="app.css">
<script src="_boa.js"></script>
<script defer src="/_boa/alpine.js"></script>
<style>
  :root { --paper: #FAF5EE; --terracotta: #E76F51; --emerald: #2A9D8F; --ink: #2B2B2B; }
  body { font-family: 'Inter', system-ui, sans-serif; color: var(--ink); background-color: var(--paper);
         background-image: repeating-linear-gradient(135deg, rgba(231,111,81,0.045) 0 2px, transparent 2px 18px); }
  .serif { font-family: 'Gowun Batang', Georgia, serif; letter-spacing: -0.01em; }
  .card { background: white; border-radius: 18px; box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px -8px rgba(0,0,0,.08); }
  [x-cloak] { display: none !important; }
</style>
</head>
<body x-data="page" class="min-h-screen">
<main class="mx-auto max-w-2xl px-4 py-8 sm:px-6 sm:py-12">

  <header class="mb-8">
    <p class="text-sm text-stone-500">From Sam · January 2027</p>
    <h1 class="serif mt-1 text-3xl sm:text-4xl">Getting ready for the trip</h1>
    <p class="mt-3 text-stone-600 leading-relaxed">One or two plain sentences on what this list is for. Tick things off as they're done: everyone with this page sees the ticks straight away.</p>
    <div class="mt-4 flex flex-wrap items-center gap-x-4 gap-y-1 text-sm text-stone-600" x-cloak x-show="$store.boa.ready">
      <span><strong x-text="doneCount()"></strong> of <span x-text="total()"></span> done</span>
      <span x-show="$store.boa.me">You're ticking as <strong x-text="$store.boa.me"></strong>
        <button type="button" class="underline decoration-stone-300 underline-offset-2 hover:decoration-stone-600" @click="$store.boa.rename()">change</button></span>
    </div>
    <div class="mt-2 h-2 w-full max-w-md overflow-hidden rounded-full bg-stone-200" x-cloak x-show="$store.boa.ready">
      <div class="h-full rounded-full bg-[var(--emerald)] transition-all" :style="'width:' + (100 * doneCount() / total()) + '%'"></div>
    </div>
  </header>

  <p x-cloak x-show="$store.boa.error" x-text="$store.boa.error" role="alert"
     class="sticky top-2 z-10 mb-4 rounded-xl bg-red-50 px-4 py-3 text-sm text-red-800 outline outline-1 outline-red-200"></p>

  <template x-for="s in sections" :key="s.id">
    <section class="card mb-6 p-5 sm:p-7" :id="s.id">
      <h2 class="serif text-xl sm:text-2xl" x-text="s.title"></h2>
      <p class="mt-2 text-[0.95rem] leading-relaxed text-stone-700" x-show="s.intro" x-text="s.intro"></p>

      <fieldset class="mt-4 grid gap-2" :disabled="$store.boa.closed">
        <legend class="sr-only" x-text="s.title"></legend>
        <template x-for="t in s.items" :key="t.id">
          <label class="flex cursor-pointer gap-3 rounded-xl p-3.5 outline outline-1 outline-stone-200 transition hover:bg-stone-50
                        has-[:checked]:bg-emerald-50 has-[:checked]:outline-[var(--emerald)]">
            <input type="checkbox" class="mt-0.5 h-5 w-5 shrink-0 accent-[var(--emerald)]"
                   :checked="$store.boa.includes(s.id + '.done', t.id)" @change="$store.boa.toggle(s.id + '.done', t.id)">
            <span class="text-[0.95rem] leading-relaxed" x-text="t.label"></span>
          </label>
        </template>
      </fieldset>
      <p class="mt-2 h-4 text-xs text-stone-500" x-show="$store.boa.has(s.id + '.done')"
         x-text="'Last ticked by ' + $store.boa.by(s.id + '.done') + ', ' + $store.boa.ago(s.id + '.done')"></p>

      <label class="mt-4 block text-sm font-medium" :for="s.id + '-note'">Notes</label>
      <!-- Text boxes always use boaText: it saves a moment after typing stops, and someone else's
           change can't overwrite what a person is in the middle of typing. -->
      <textarea :id="s.id + '-note'" rows="2" x-data="boaText(s.id + '.note')" x-model="draft" x-bind="field"
                placeholder="Anything worth knowing about this part"
                class="mt-1.5 w-full rounded-xl p-3 text-base sm:text-sm outline outline-1 outline-stone-300 focus:outline-2 focus:outline-[var(--terracotta)] disabled:bg-stone-50"></textarea>
      <p class="mt-1 h-4 text-xs text-stone-500"
         x-text="$store.boa.saving[s.id + '.note'] ? 'Saving…' : ($store.boa.has(s.id + '.note') ? 'Last edited by ' + $store.boa.by(s.id + '.note') + ', ' + $store.boa.ago(s.id + '.note') : '')"></p>
    </section>
  </template>

  <footer class="mt-10 text-center text-xs text-stone-400">Ticks and notes save as you go. Everyone with this page sees them.</footer>
</main>

<script>
document.addEventListener("alpine:init", () => {
  Alpine.data("page", () => ({
    // Answers are stored under these ids (travel.done, travel.note). Once the page has been
    // shared, never change an id: add new ones instead.
    sections: [
      {
        id: "travel",
        title: "Before we go",
        intro: "A sentence on this group of jobs, if it helps.",
        items: [
          { id: "tickets", label: "Book the train tickets" },
          { id: "insurance", label: "Check the travel insurance covers everyone" },
          { id: "cat", label: "Ask next door to feed the cat" },
        ],
      },
      {
        id: "packing",
        title: "Packing",
        items: [
          { id: "passports", label: "Passports" },
          { id: "chargers", label: "Phone chargers and the adaptor" },
        ],
      },
    ],
    total() { return this.sections.reduce((n, s) => n + s.items.length, 0); },
    doneCount() { return this.sections.reduce((n, s) => n + s.items.filter((t) => this.$store.boa.includes(s.id + ".done", t.id)).length, 0); },
  }));
});
</script>
</body>
</html>
